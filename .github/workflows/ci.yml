name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  dotnet:
    name: .NET Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore GovernmentDomainCopilot.sln

      - name: Build
        run: dotnet build GovernmentDomainCopilot.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test GovernmentDomainCopilot.sln --no-build --configuration Release

  angular:
    name: Angular Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: src/Web/package-lock.json

      - name: Install dependencies
        working-directory: src/Web
        run: npm ci

      - name: Build
        working-directory: src/Web
        run: npm run build