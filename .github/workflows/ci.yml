name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  dotnet:
    name: .NET Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee # v4.0.1
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore GovernmentDomainCopilot.sln

      - name: Build
        run: dotnet build GovernmentDomainCopilot.sln --no-restore --configuration Release

      - name: Lint and format verification
        run: dotnet format GovernmentDomainCopilot.sln --verify-no-changes --no-restore

      # Run each assembly separately so Docker-backed PostgreSQL fixtures are not
      # contended by the solution-level test runner.
      - name: Test Domain
        run: dotnet test tests/Domain.Tests/Domain.Tests.csproj --no-build --configuration Release

      - name: Test Application
        run: dotnet test tests/Application.Tests/Application.Tests.csproj --no-build --configuration Release

      - name: Test Contract
        run: dotnet test tests/Contract.Tests/Contract.Tests.csproj --no-build --configuration Release

      - name: Test Integration
        run: dotnet test tests/Integration.Tests/Integration.Tests.csproj --no-build --configuration Release

  angular:
    name: Angular Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: src/Web/package-lock.json

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        working-directory: src/Web
        run: npm ci

      - name: Build
        working-directory: src/Web
        run: npm run build
